{% extends "base.html" %}

{% block title %}Attendance History - SAMS{% endblock %}

{% block content %}
  <header class="page-header">
    <h1>Attendance History</h1>
  </header>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Present</th>
        <th>Total</th>
      </tr>
    </thead>

    <tbody>
      {% for d in dates %}
        <tr>
          <td><a href="{{ url_for('attendance.history_detail', date_str=d.date) }}">{{ d.date }}</a></td>
          <td>{{ d.present }}</td>
          <td>{{ d.total }}</td>
        </tr>
      {% else %}
        <tr><td colspan="3">No attendance recorded yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
