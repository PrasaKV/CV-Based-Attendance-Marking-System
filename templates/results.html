<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>SAMS - Results</title>
		<link
			rel="stylesheet"
			href="{{ url_for('static', filename='style.css') }}"
		/>
	</head>
	<body>
		<div class="container wide">
			<h1>Attendance Results - {{ date }}</h1>
			<a href="/" class="btn secondary">← Back to Upload</a>

			<!-- Table taking full width at the top -->
			<div class="table-section">
				<h2>Attendance Markings</h2>
				<table>
					<thead>
						<tr>
							<th>Index</th>
							<th>Name</th>
							<th>Status</th>
						</tr>
					</thead>
					<tbody>
						{% for row in results %}
						<tr>
							<td>{{ row.index }}</td>
							<td>{{ row.name }}</td>
							<td
								class="{{ 'status-present' if row.status == 'Present' else 'status-absent' }}"
							>
								{{ row.status }}
							</td>
						</tr>
						{% endfor %}
					</tbody>
				</table>
			</div>

			<!-- Images displayed side-by-side underneath -->
			<div class="image-section">
				<h2>Image Processing Progress</h2>
				<div class="image-gallery">
					<div class="image-card">
						<h3>1. Original</h3>
						<img
							src="{{ url_for('static', filename=steps.original) }}"
							alt="Original Image"
						/>
					</div>
					<div class="image-card">
						<h3>2. Grayscale</h3>
						<img
							src="{{ url_for('static', filename=steps.grayscale) }}"
							alt="Grayscale Image"
						/>
					</div>
					<div class="image-card">
						<h3>3. Binarization (Inverse)</h3>
						<img
							src="{{ url_for('static', filename=steps.binarized) }}"
							alt="Binarized Image"
						/>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
