<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SAMS - Upload Attendance Files</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <div class="container">
      <header class="page-header">
        <h1>Student Attendance Management System</h1>

        <p class="page-description">
          Upload the signing sheet image and student information XML file
          to automatically process attendance.
        </p>
      </header>

      <main class="upload-section">
        <form
          action="{{ url_for('upload') }}"
          method="POST"
          enctype="multipart/form-data"
          class="upload-form"
        >
          <div class="form-group">
            <label for="image">
              Signing Sheet Image
            </label>

            <input
              type="file"
              name="image"
              id="image"
              accept="image/png, image/jpeg, image/jpg"
              required
            />

            <small>
              Accepted formats: PNG, JPG, JPEG
            </small>
          </div>

          <div class="form-group">
            <label for="xml">
              Student Information File
            </label>

            <input
              type="file"
              name="xml"
              id="xml"
              accept=".xml"
              required
            />

            <small>
              Accepted format: XML
            </small>
          </div>

          <button type="submit" class="btn">
            Process Attendance
          </button>
        </form>
      </main>
    </div>
  </body>
</html>
